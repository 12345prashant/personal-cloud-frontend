

<div class="container mt-4">

    <div class="card shadow border-0">

        <div class="card-body">

            <div class="row align-items-center">

                <div class="col-md-6">

                    <h3>

                        <i class="bi bi-folder2-open me-2"></i>

                        My Files

                    </h3>

                </div>

                <div class="col-md-6 text-end">

                    <input
                            type="file"
                            hidden
                            #fileInput
                            (change)="onFileSelected($event)">

                    <button
                            class="btn btn-success"

                            (click)="fileInput.click()">

                        <i class="bi bi-upload me-2"></i>

                        Choose File

                    </button>

                    <button

                            class="btn btn-primary ms-2"

                            [disabled]="!selectedFile"

                            (click)="upload()">

                        Upload

                    </button>

                </div>

            </div>

            <div
                    *ngIf="selectedFile"
                    class="alert alert-light mt-3">

                Selected :

                <strong>

                    {{selectedFile.name}}

                </strong>

            </div>

        </div>

    </div>

    <div class="card shadow border-0 mt-4">

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-6">

                    <h4>

                        Stored Files

                    </h4>

                </div>

                <div class="col-md-6">

                    <input

                            class="form-control"

                            placeholder="Search files..."

                            [(ngModel)]="searchText">

                </div>

            </div>

            <div
                    *ngIf="loading"
                    class="text-center p-5">

                <div class="spinner-border text-primary">

                </div>

                <p class="mt-3">

                    Loading files...

                </p>

            </div>

            <table

                    *ngIf="!loading && files.length>0"

                    class="table table-hover align-middle">

                <thead>

                <tr>

                    <th></th>

                    <th>Name</th>

                    <th>Type</th>

                    <th>Size</th>

                    <th>Uploaded</th>

                    <th width="180">

                        Action

                    </th>

                </tr>

                </thead>

                <tbody>

                <tr

                        *ngFor="let file of files">

                    <td>

                        <i

                                [class]="getFileIcon(file.contentType)"

                                style="font-size:26px">

                        </i>

                    </td>

                    <td>

                        <strong>

                            {{file.originalName}}

                        </strong>

                    </td>

                    <td>

                        {{file.contentType}}

                    </td>

                    <td>

                        {{formatSize(file.fileSize)}}

                    </td>

                    <td>

                        {{formatDate(file.uploadedAt)}}

                    </td>

                    <td>

                        <button

                                class="btn btn-outline-primary btn-sm me-2"

                                (click)="download(file)">

                            <i class="bi bi-download"></i>

                        </button>

                        <button

                                class="btn btn-outline-danger btn-sm"

                                (click)="delete(file.fileUuid)">

                            <i class="bi bi-trash"></i>

                        </button>

                    </td>

                </tr>

                </tbody>

            </table>

            <div

                    *ngIf="!loading && files.length==0"

                    class="text-center p-5">

                <i

                        class="bi bi-folder-x"

                        style="font-size:70px;color:gray">

                </i>

                <h4 class="mt-3">

                    No Files Uploaded

                </h4>

                <p>

                    Upload your first file.

                </p>

            </div>

        </div>

    </div>

</div>
